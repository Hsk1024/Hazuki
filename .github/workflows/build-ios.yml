name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # 支持在 GitHub 网页手动点击触发

jobs:
  build-ios:
    runs-on: macos-26 # Apple Silicon，自带 Xcode 26 SDK（macos-14 已弃用，缺新 SDK API）
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 无证书编译 iOS Runner.app 产物
      - name: Build Flutter iOS (No Codesign)
        run: |
          flutter build ios --release --no-codesign --verbose

      # 将生成的 Runner.app 打包为标准的 Payload 结构并压缩成 .ipa
      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Hazuki-unsigned.ipa Payload

      # 上传生成的 IPA 文件供下载
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Hazuki-unsigned-ipa
          path: Hazuki-unsigned.ipa
