name: Build Unsigned IPA

on:
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发构建

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 如果是 Flutter / React Native / Ionic，需在此处插入对应 SDK 安装与依赖下载步骤

      - name: Build Unsigned .app
        run: |
          xcodebuild clean build \
            -project "ios/YourApp.xcodeproj" \
            -scheme "YourApp" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="build"

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # 将编译生成的 .app 拷贝进 Payload 目录
          cp -r build/Release-iphoneos/*.app Payload/
          # 压缩为 ipa 文件
          zip -r YourApp_unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: YourApp_unsigned.ipa
